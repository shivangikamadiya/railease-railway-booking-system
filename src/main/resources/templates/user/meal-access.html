<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title layout:fragment="title">Enter Ticket ID - RailEase</title>
    <style>
        .meal-access-shell {
            min-height: calc(100vh - 180px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 32px 0;
        }

        .meal-access-card {
            width: 100%;
            max-width: 640px;
            background: #fff;
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 20px 50px rgba(30, 27, 75, 0.08);
        }

        .ticket-input {
            min-height: 56px;
            border-radius: 14px;
            border: 1px solid #d9def2;
            padding: 12px 16px;
            font-size: 1rem;
        }

        .ticket-input:focus {
            border-color: #4361ee;
            box-shadow: 0 0 0 0.2rem rgba(67, 97, 238, 0.12);
        }

        .submit-btn {
            min-height: 52px;
            border: none;
            border-radius: 14px;
            font-weight: 600;
            background: linear-gradient(135deg, #4361ee 0%, #3a0ca3 100%);
            color: #fff;
        }
    </style>
</head>
<body>
<div layout:fragment="content">
    <div class="container meal-access-shell">
        <div class="meal-access-card">
            <div class="mb-4">
                <span class="badge rounded-pill text-bg-warning-subtle text-warning-emphasis px-3 py-2 mb-3">
                    <i class="bi bi-cup-hot me-2"></i>E-Pantry Access
                </span>
                <h2 class="fw-bold mb-2">Enter your Ticket ID to order a meal</h2>
                <p class="text-muted mb-0">Only confirmed upcoming tickets can use E-pantry ordering.</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

            <form th:action="@{/user/meal-access}" method="post">
                <input type="hidden" name="mealId" th:if="${mealId != null}" th:value="${mealId}">

                <label for="ticketId" class="form-label fw-semibold">Ticket ID</label>
                <input id="ticketId"
                       name="ticketId"
                       type="text"
                       class="form-control ticket-input mb-3"
                       placeholder="Example: TK2026022299971000"
                       autocomplete="off"
                       required>

                <div class="small text-muted mb-4">
                    Use the Ticket ID from your booking confirmation or My Bookings page.
                </div>

                <div class="d-flex gap-3 flex-wrap">
                    <button type="submit" class="btn submit-btn px-4">Continue to E-Pantry</button>
                    <a th:href="@{/user/my-bookings}" class="btn btn-outline-secondary px-4 d-inline-flex align-items-center">
                        View My Bookings
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
</body>
</html>
