<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title layout:fragment="title">My Profile</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="row">
            <div class="col-md-4 mb-4">
                <div class="card text-center">
                    <div class="card-body">
                        <div class="mb-3">
                            <div class="rounded-circle bg-light d-inline-flex p-3" style="width: 150px; height: 150px;">
                                <th:block th:if="${user.profilePhotoBase64 != null}">
                                    <img th:src="'data:image/jpeg;base64,' + ${user.profilePhotoBase64}"
                                         class="img-fluid rounded-circle" alt="Profile" style="width: 100%; height: 100%; object-fit: cover;">
                                </th:block>
                                <th:block th:unless="${user.profilePhotoBase64 != null}">
                                    <i class="fas fa-user-circle fa-6x text-primary m-auto"></i>
                                </th:block>
                            </div>
                        </div>
                        <h4 class="fw-bold" th:text="${user.fullName}">John Doe</h4>
                        <p class="text-muted">
                                <span class="badge" th:classappend="${user.role == 'ADMIN' ? 'bg-warning' : 'bg-info'}"
                                      th:text="${user.role}">CUSTOMER</span>
                        </p>
                        <div class="d-grid gap-2">
                            <a th:href="@{/user/edit-profile}" class="btn btn-primary">
                                <i class="fas fa-edit me-2"></i>Edit Profile
                            </a>
                            <a th:href="@{/user/change-password}" class="btn btn-outline-primary">
                                <i class="fas fa-key me-2"></i>Change Password
                            </a>
                        </div>
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <!-- Success/Error Messages -->
                <div th:if="${successMessage}" class="alert alert-success alert-dismissible fade show">
                    <i class="fas fa-check-circle me-2"></i><span th:text="${successMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show">
                    <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>

                <!-- Personal Information -->
                <div class="card mb-4">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-user me-2 text-primary"></i>Personal Information</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-borderless">
                            <tr>
                                <th width="30%">Username:</th>
                                <td th:text="${user.username}">johndoe</td>
                            </tr>
                            <tr>
                                <th>Full Name:</th>
                                <td th:text="${user.fullName}">John Doe</td>
                            </tr>
                            <tr>
                                <th>Email:</th>
                                <td th:text="${user.email}">john@example.com</td>
                            </tr>
                            <tr>
                                <th>Mobile Number:</th>
                                <td th:text="${user.mobileNumber ?: 'Not provided'}">9876543210</td>
                            </tr>
                        </table>
                    </div>
                </div>

                <!-- Account Details -->
                <div class="card">
                    <div class="card-header bg-white">
                        <h5 class="mb-0"><i class="fas fa-cog me-2 text-primary"></i>Account Details</h5>
                    </div>
                    <div class="card-body">
                        <table class="table table-borderless">
                            <tr>
                                <th width="30%">Account Created:</th>
                                <td th:text="${#temporals.format(user.createdAt, 'dd MMMM yyyy HH:mm')}">01 Jan 2026 10:30</td>
                            </tr>
                            <tr>
                                <th>Last Login:</th>
                                <td th:text="${user.lastLogin != null ? #temporals.format(user.lastLogin, 'dd MMMM yyyy HH:mm') : 'Never'}">01 Jan 2026 10:30</td>
                            </tr>
                            <tr>
                                <th>Email Verified:</th>
                                <td>
                                        <span th:if="${user.isEnabled}" class="text-success">
                                            <i class="fas fa-check-circle me-1"></i>Verified
                                        </span>
                                    <span th:unless="${user.isEnabled}" class="text-danger">
                                            <i class="fas fa-times-circle me-1"></i>Not Verified
                                        </span>
                                </td>
                            </tr>
                            <tr>
                                <th>Total Bookings:</th>
                                <td><span class="fw-bold text-primary" th:text="${totalBookings}">5</span></td>
                            </tr>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
