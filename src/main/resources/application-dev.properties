# ===================================
# Development Environment Configuration
# ===================================
spring.profiles.active=dev
spring.application.name=RailEase (Development)

# ===================================
# Server Configuration
# ===================================
server.port=8081
server.servlet.context-path=/RailEase
server.error.path=/error
server.error.include-stacktrace=always
server.error.include-exception=true
server.error.include-message=always
server.error.include-binding-errors=always

# ===================================
# Development Database Configuration (Local MySQL)
# ===================================
spring.datasource.url=jdbc:mysql://localhost:3306/railease_dev_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
spring.datasource.username=root
spring.datasource.password=root123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Connection Pool Settings for Dev
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-test-query=SELECT 1

# ===================================
# JPA Configuration for Development
# ===================================
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.open-in-view=false
spring.jpa.defer-datasource-initialization=true

# Enable SQL logging for debugging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.org.hibernate.type.descriptor.sql.BasicExtractor=TRACE

# ===================================
# Development Email Configuration (Gmail)
# ===================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=kamadiyashivangi23@gmail.com
spring.mail.password=hghvschjkqghkivc
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=true

# ===================================
# Thymeleaf Configuration for Development
# ===================================
spring.thymeleaf.cache=false
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.check-template-location=true
spring.thymeleaf.servlet.cache=false

# ===================================
# File Upload Configuration
# ===================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=/tmp/railease-uploads/dev

# ===================================
# Development Logging
# ===================================
logging.level.com.railease=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.security=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n
logging.file.path=./logs/dev
logging.file.name=./logs/dev/railease-dev.log
logging.logback.rollingpolicy.max-history=7
logging.logback.rollingpolicy.max-file-size=10MB

# ===================================
# Application Custom Properties for Dev
# ===================================
app.base-url=http://localhost:8081/RailEase
app.verification.endpoint=/verify-email
app.profile.photo.upload-dir=uploads/dev/profiles/
app.meal.image.upload-dir=uploads/dev/meals/
app.email.from=noreply-dev@railease.com
app.email.sender-name=RailEase Dev Team

# ===================================
# Development Specific Flags
# ===================================
app.dev-mode=true
app.skip-email-verification=false
app.demo-data.enabled=true
app.demo-data.file=sql/dummy-data.sql

# ===================================
# Actuator Endpoints (Optional)
# ===================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true