<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
  <title layout:fragment="title">Booking Error</title>
</head>
<body>
<div layout:fragment="content">
  <div class="row justify-content-center">
    <div class="col-md-8 col-lg-6">
      <div class="card text-center p-5">
        <div class="mb-4">
          <i class="fas fa-times-circle fa-4x text-danger mb-3"></i>
          <h2 class="fw-bold mb-3">Booking Failed</h2>
          <div class="alert alert-danger" th:text="${errorMessage}">
            Error message will appear here
          </div>
        </div>
        <div class="d-flex justify-content-center gap-3">
          <a href="javascript:history.back()" class="btn btn-outline-primary">
            <i class="fas fa-arrow-left me-2"></i>Go Back
          </a>
          <a th:href="@{/user/view-trains}" class="btn btn-primary">
            <i class="fas fa-train me-2"></i>View Trains
          </a>
        </div>
      </div>
    </div>
  </div>
</div>
</body>
</html>
