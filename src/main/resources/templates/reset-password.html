<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title layout:fragment="title">Reset Password</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card">
                <div class="card-body p-4 p-md-5">
                    <h3 class="fw-bold mb-3 text-center">Reset Password</h3>

                    <div th:if="${errorMessage}" class="alert alert-danger" th:text="${errorMessage}"></div>

                    <div th:if="${tokenInvalid == true}">
                        <p class="text-muted mb-0">Please request a new password reset link.</p>
                        <div class="mt-3">
                            <a th:href="@{/forgot-password}" class="btn btn-primary w-100">Request New Link</a>
                        </div>
                    </div>

                    <form th:if="${tokenInvalid != true}" th:action="@{/reset-password}" method="post">
                        <input type="hidden" name="token" th:value="${token}">

                        <div class="mb-3">
                            <label for="password" class="form-label fw-semibold">New Password</label>
                            <input type="password" id="password" name="password"
                                   class="form-control" minlength="6" required>
                        </div>

                        <div class="mb-3">
                            <label for="confirmPassword" class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" id="confirmPassword" name="confirmPassword"
                                   class="form-control" minlength="6" required>
                        </div>

                        <button type="submit" class="btn btn-primary w-100">Update Password</button>
                    </form>

                    <div class="text-center mt-3">
                        <a th:href="@{/login}" class="text-decoration-none">Back to Login</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
