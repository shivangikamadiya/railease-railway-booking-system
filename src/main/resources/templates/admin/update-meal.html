<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/admin/admin-layout}">
<head>
  <title layout:fragment="title">Update Meal</title>
</head>
<body>
<div layout:fragment="admin-content">
  <div class="page-header">
    <h4 class="fw-bold mb-0">
      <i class="fas fa-edit me-2 text-primary"></i>
      Update Meal
    </h4>
    <a th:href="@{/admin/meals}" class="btn btn-secondary">
      <i class="fas fa-arrow-left me-2"></i>Back to Meals
    </a>
  </div>

  <div class="card">
    <div class="card-body">
      <form th:action="@{/admin/meals/update/{id}(id=${mealDTO.id})}"
            th:object="${mealDTO}" method="post" enctype="multipart/form-data">
        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Meal Name *</label>
            <input type="text" class="form-control" th:field="*{mealName}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('mealName')}"
                 th:errors="*{mealName}"></div>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Price (₹) *</label>
            <input type="number" step="0.01" class="form-control" th:field="*{price}" required>
            <div class="text-danger" th:if="${#fields.hasErrors('price')}"
                 th:errors="*{price}"></div>
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Description</label>
          <textarea class="form-control" th:field="*{description}" rows="3"></textarea>
        </div>

        <div class="row">
          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Meal Type</label>
            <select class="form-select" th:field="*{mealType}">
              <option value="">Select Type</option>
              <option value="VEG">Vegetarian</option>
              <option value="NON_VEG">Non-Vegetarian</option>
              <option value="BEVERAGE">Beverage</option>
              <option value="SNACK">Snack</option>
            </select>
          </div>

          <div class="col-md-6 mb-3">
            <label class="form-label fw-bold">Preparation Time (minutes)</label>
            <input type="number" class="form-control" th:field="*{preparationTime}" min="1">
          </div>
        </div>

        <div class="mb-3">
          <label class="form-label fw-bold">Meal Image (Leave empty to keep current)</label>
          <input type="file" class="form-control" th:field="*{mealImage}" accept="image/*">
        </div>

        <div class="mb-3 form-check">
          <input type="checkbox" class="form-check-input" th:field="*{availabilityStatus}" id="availabilityStatus">
          <label class="form-check-label" for="availabilityStatus">Available for ordering</label>
        </div>

        <div class="mt-4">
          <button type="submit" class="btn btn-primary">
            <i class="fas fa-save me-2"></i>Update Meal
          </button>
          <a th:href="@{/admin/meals}" class="btn btn-secondary ms-2">
            <i class="fas fa-times me-2"></i>Cancel
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
