name=RailEaseLogging
appenders = console, file

# Console Appender
appender.console.type = Console
appender.console.name = STDOUT
appender.console.layout.type = PatternLayout
appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%-5p] %c{1}:%L - %m%n

# File Appender
appender.file.type = RollingFile
appender.file.name = LOGFILE
appender.file.fileName = logs/railease.log
appender.file.filePattern = logs/railease-%d{yyyy-MM-dd}-%i.log
appender.file.layout.type = PatternLayout
appender.file.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} [%-5p] %c{1}:%L - %m%n
appender.file.policies.type = Policies
appender.file.policies.time.type = TimeBasedTriggeringPolicy
appender.file.policies.time.interval = 1
appender.file.policies.time.modulate = true
appender.file.policies.size.type = SizeBasedTriggeringPolicy
appender.file.policies.size.size = 10MB
appender.file.strategy.type = DefaultRolloverStrategy
appender.file.strategy.max = 10

# Root Logger
rootLogger.level = INFO
rootLogger.appenderRefs = stdout, file
rootLogger.appenderRef.stdout.ref = STDOUT
rootLogger.appenderRef.file.ref = LOGFILE

# Application specific loggers
logger.railease.name = com.railease
logger.railease.level = DEBUG
logger.railease.appenderRef.stdout.ref = STDOUT
logger.railease.appenderRef.file.ref = LOGFILE

# Spring Framework
logger.spring.name = org.springframework
logger.spring.level = WARN

# Hibernate
logger.hibernate.name = org.hibernate
logger.hibernate.level = WARN