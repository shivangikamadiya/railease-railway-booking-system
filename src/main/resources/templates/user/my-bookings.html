<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title layout:fragment="title">My Bookings</title>
    <link rel="stylesheet" th:href="@{/webjars/datatables/1.13.6/css/dataTables.bootstrap5.min.css}">
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-4">
        <div class="card">
            <div class="card-header bg-white">
                <h4 class="mb-0"><i class="fas fa-ticket-alt me-2 text-primary"></i>My Bookings</h4>
            </div>
            <div class="card-body">
                <div th:if="${#lists.isEmpty(allBookings)}" class="text-center py-5">
                    <i class="fas fa-ticket-alt fa-4x text-muted mb-3"></i>
                    <h5>No bookings found</h5>
                    <p class="text-muted">You haven't booked any tickets yet.</p>
                    <a th:href="@{/user/view-trains}" class="btn btn-primary">
                        <i class="fas fa-train me-2"></i>Browse Trains
                    </a>
                </div>
                <div th:unless="${#lists.isEmpty(allBookings)}" class="table-responsive">
                    <table class="table table-hover datatable">
                        <thead>
                        <tr>
                            <th>Ticket ID</th>
                            <th>Train</th>
                            <th>Journey Date</th>
                            <th>Passenger</th>
                            <th>Class</th>
                            <th>Seats</th>
                            <th>Total Fare</th>
                            <th>Booking Date</th>
                            <th>Status</th>
                            <th>Actions</th>
                        </tr>
                        </thead>
                        <tbody>
                        <tr th:each="ticket : ${allBookings}">
                            <td><span class="fw-bold" th:text="${ticket.ticketId}">TK123456</span></td>
                            <td>
                                <span th:text="${ticket.train.trainName}">Rajdhani</span><br>
                                <small class="text-muted" th:text="${ticket.train.trainNo}">12301</small>
                            </td>
                            <td th:text="${#temporals.format(ticket.journeyDate, 'dd-MM-yyyy')}">01-01-2026</td>
                            <td th:text="${ticket.passengerName}">John Doe</td>
                            <td th:text="${ticket.classType}">AC</td>
                            <td th:text="${ticket.numberOfSeats}">2</td>
                            <td>₹<span th:text="${ticket.totalFare}">2500</span></td>
                            <td th:text="${#temporals.format(ticket.bookingDate, 'dd-MM-yyyy HH:mm')}">01-01-2026 10:30</td>
                            <td>
                                        <span class="badge" th:classappend="${ticket.ticketStatus.name() == 'CONFIRMED' ? 'bg-success' :
                                                                              (ticket.ticketStatus.name() == 'CANCELLED' ? 'bg-danger' : 'bg-warning')}">
                                            <span th:text="${ticket.ticketStatus.name()}">CONFIRMED</span>
                                        </span>
                            </td>
                            <td>
                                <div class="btn-group" role="group">
                                    <a th:href="@{/user/ticket/{id}(id=${ticket.ticketId})}"
                                       class="btn btn-sm btn-outline-primary" title="View Ticket">
                                        <i class="fas fa-eye"></i>
                                    </a>
                                    <a th:if="${ticket.ticketStatus.name() == 'CONFIRMED'}"
                                       th:href="@{/user/cancel-ticket/{id}(id=${ticket.ticketId})}"
                                       class="btn btn-sm btn-outline-danger"
                                       onclick="return confirm('Are you sure you want to cancel this ticket?')"
                                       title="Cancel Ticket">
                                        <i class="fas fa-times"></i>
                                    </a>
                                    <a th:href="@{/booking/download-pdf/{ticketId}(ticketId=${ticket.ticketId})}"
                                       class="btn btn-sm btn-outline-success" title="Download Ticket">
                                        <i class="fas fa-download"></i>
                                    </a>
                                    <a th:if="${ticket.ticketStatus.name() == 'CONFIRMED' and !ticket.journeyDate.isBefore(today)}"
                                       th:href="@{/user/meal-order/{id}(id=${ticket.ticketId})}"
                                       class="btn btn-sm btn-outline-warning" title="Order Meal">
                                        <i class="fas fa-utensils"></i>
                                    </a>
                                </div>
                            </td>
                        </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
</div>

<div layout:fragment="scripts">
    <script th:src="@{/webjars/datatables/1.13.6/js/jquery.dataTables.min.js}"></script>
    <script th:src="@{/webjars/datatables/1.13.6/js/dataTables.bootstrap5.min.js}"></script>
    <script>
        $(document).ready(function() {
            $('.datatable').DataTable({
                pageLength: 10,
                order: [ [7, 'desc'] ],
                language: {
                    search: "Search bookings:",
                    lengthMenu: "Show _MENU_ bookings per page"
                }
            });
        });
    </script>
</div>
</body>
</html>
