# ===================================
# Production Environment Configuration
# ===================================
spring.profiles.active=prod
spring.application.name=RailEase Production

# ===================================
# Server Configuration
# ===================================
server.port=8080
server.servlet.context-path=/
server.error.path=/error
server.error.include-stacktrace=never
server.error.include-exception=false
server.error.include-message=never
server.error.include-binding-errors=never
server.compression.enabled=true
server.compression.mime-types=text/html,text/css,application/javascript,application/json
server.tomcat.max-connections=10000
server.tomcat.max-threads=200
server.tomcat.min-spare-threads=20
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
server.tomcat.max-http-form-post-size=2MB

# ===================================
# Production Database Configuration (Production MySQL)
# ===================================
# Replace with your production database details
spring.datasource.url=jdbc:mysql://production-db-host:3306/railease_prod_db?useSSL=true&requireSSL=true&serverTimezone=UTC&allowPublicKeyRetrieval=false
spring.datasource.username=railease_prod_user
spring.datasource.password=${DB_PASSWORD}  # Set via environment variable
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000

# ===================================
# JPA Configuration for Production
# ===================================
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.generate_statistics=false
spring.jpa.properties.hibernate.cache.use_second_level_cache=false
spring.jpa.properties.hibernate.cache.use_query_cache=false
spring.jpa.properties.hibernate.jdbc.batch_size=20
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true
spring.jpa.open-in-view=false

# Disable SQL logging in production
logging.level.org.hibernate.SQL=WARN
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=WARN

# ===================================
# Production Email Configuration (Use environment variables)
# ===================================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USERNAME}  # Set via environment variable
spring.mail.password=${EMAIL_PASSWORD}  # Set via environment variable
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000
spring.mail.default-encoding=UTF-8
spring.mail.test-connection=false

# ===================================
# Thymeleaf Configuration for Production
# ===================================
spring.thymeleaf.cache=true
spring.thymeleaf.enabled=true
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.servlet.content-type=text/html
spring.thymeleaf.check-template-location=true
spring.thymeleaf.servlet.cache=true
spring.thymeleaf.cache-ttl-ms=3600000

# ===================================
# File Upload Configuration for Production
# ===================================
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.location=/var/railease-uploads/prod

# ===================================
# Production Logging
# ===================================
logging.level.com.railease=INFO
logging.level.org.springframework.web=WARN
logging.level.org.springframework.security=WARN
logging.file.path=/var/log/railease
logging.file.name=/var/log/railease/railease-prod.log
logging.logback.rollingpolicy.max-history=30
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.total-size-cap=1GB
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# ===================================
# Application Custom Properties for Production
# ===================================
app.base-url=https://www.railease.com
app.verification.endpoint=/verify-email
app.profile.photo.upload-dir=/var/railease-uploads/prod/profiles/
app.meal.image.upload-dir=/var/railease-uploads/prod/meals/
app.email.from=noreply@railease.com
app.email.sender-name=RailEase Team

# ===================================
# Production Specific Flags
# ===================================
app.dev-mode=false
app.skip-email-verification=false
app.demo-data.enabled=false
app.maintenance-mode=false
app.security.require-https=true
app.session-timeout=1800  # 30 minutes in seconds

# ===================================
# Security Configuration
# ===================================
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.tracking-modes=cookie

# ===================================
# Actuator Endpoints (Secure in Production)
# ===================================
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.endpoint.info.enabled=true
management.endpoints.web.base-path=/manage
management.server.port=8081
management.server.address=127.0.0.1

# ===================================
# SSL Configuration (if using HTTPS directly)
# ===================================
# server.ssl.key-store=classpath:keystore.p12
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12
# server.ssl.key-alias=railease
# server.ssl.enabled=true

# ===================================
# CORS Configuration
# ===================================
app.cors.allowed-origins=https://www.railease.com,https://admin.railease.com
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
app.cors.allowed-headers=*
app.cors.allow-credentials=true
app.cors.max-age=3600

# ===================================
# Rate Limiting
# ===================================
app.rate-limit.enabled=true
app.rate-limit.capacity=100
app.rate-limit.refill-interval=60
app.rate-limit.refill-tokens=10

# ===================================
# Cache Configuration
# ===================================
spring.cache.type=simple
spring.cache.cache-names=trains,users,bookings
spring.cache.redis.time-to-live=600000