<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title layout:fragment="title">Validation Error</title>
</head>
<body>
<div layout:fragment="content">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card p-5">
                <div class="text-center mb-4">
                    <i class="fas fa-exclamation-triangle fa-4x text-warning mb-3"></i>
                    <h2 class="fw-bold mb-3">Validation Errors</h2>
                </div>

                <div class="alert alert-danger" th:if="${#maps.size(errors) > 0}">
                    <ul class="mb-0">
                        <li th:each="error : ${errors}" th:text="${error.value}"></li>
                    </ul>
                </div>

                <div class="text-center mt-4">
                    <a href="javascript:history.back()" class="btn btn-primary px-5">
                        <i class="fas fa-arrow-left me-2"></i>Go Back
                    </a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
