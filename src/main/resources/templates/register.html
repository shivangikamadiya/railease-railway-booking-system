<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layout/main-layout}">
<head>
    <title layout:fragment="title">Register - RailEase</title>
</head>
<body>
<div layout:fragment="content">
    <div class="container mt-5">
        <div class="row justify-content-center">z
            <div class="col-md-8 col-lg-6">
                <div class="card shadow">
                    <div class="card-header bg-primary text-white text-center py-3">
                        <h4 class="mb-0"><i class="fas fa-user-plus me-2"></i>Create RailEase Account</h4>
                    </div>
                    <div class="card-body p-4">

                        <!-- Display error messages -->
                        <div th:if="${errorMessage}" class="alert alert-danger alert-dismissible fade show" role="alert">
                            <i class="fas fa-exclamation-circle me-2"></i><span th:text="${errorMessage}"></span>
                            <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                        </div>

                        <div th:if="${usernameError}" class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${usernameError}"></span>
                        </div>

                        <div th:if="${emailError}" class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${emailError}"></span>
                        </div>

                        <div th:if="${passwordError}" class="alert alert-warning">
                            <i class="fas fa-exclamation-triangle me-2"></i><span th:text="${passwordError}"></span>
                        </div>

                        <form th:action="@{/register}" th:object="${userRegistrationDTO}" method="post" enctype="multipart/form-data">

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="username" class="form-label fw-bold">
                                        <i class="fas fa-user me-2"></i>Username*
                                    </label>
                                    <input type="text" class="form-control" id="username"
                                           th:field="*{username}" placeholder="Choose a username" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('username')}"
                                         th:errors="*{username}"></div>
                                    <small class="text-muted">Minimum 3 characters</small>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="email" class="form-label fw-bold">
                                        <i class="fas fa-envelope me-2"></i>Email*
                                    </label>
                                    <input type="email" class="form-control" id="email"
                                           th:field="*{email}" placeholder="Enter your email" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('email')}"
                                         th:errors="*{email}"></div>
                                </div>
                            </div>

                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="password" class="form-label fw-bold">
                                        <i class="fas fa-lock me-2"></i>Password*
                                    </label>
                                    <input type="password" class="form-control" id="password"
                                           th:field="*{password}" placeholder="Create password" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('password')}"
                                         th:errors="*{password}"></div>
                                    <small class="text-muted">Minimum 6 characters</small>
                                </div>

                                <div class="col-md-6 mb-3">
                                    <label for="confirmPassword" class="form-label fw-bold">
                                        <i class="fas fa-lock me-2"></i>Confirm Password*
                                    </label>
                                    <input type="password" class="form-control" id="confirmPassword"
                                           th:field="*{confirmPassword}" placeholder="Re-enter password" required>
                                    <div class="text-danger" th:if="${#fields.hasErrors('confirmPassword')}"
                                         th:errors="*{confirmPassword}"></div>
                                </div>
                            </div>

                            <div class="mb-3">
                                <label for="fullName" class="form-label fw-bold">
                                    <i class="fas fa-signature me-2"></i>Full Name*
                                </label>
                                <input type="text" class="form-control" id="fullName"
                                       th:field="*{fullName}" placeholder="Enter your full name" required>
                                <div class="text-danger" th:if="${#fields.hasErrors('fullName')}"
                                     th:errors="*{fullName}"></div>
                            </div>

                            <div class="mb-3">
                                <label for="mobileNumber" class="form-label fw-bold">
                                    <i class="fas fa-phone me-2"></i>Mobile Number
                                </label>
                                <input type="tel" class="form-control" id="mobileNumber"
                                       th:field="*{mobileNumber}" placeholder="10 digit mobile number"
                                       pattern="[0-9]{10}" maxlength="10">
                                <div class="text-danger" th:if="${#fields.hasErrors('mobileNumber')}"
                                     th:errors="*{mobileNumber}"></div>
                                <small class="text-muted">Optional: Enter 10 digits only</small>
                            </div>

                            <div class="mb-4">
                                <label for="profilePhoto" class="form-label fw-bold">
                                    <i class="fas fa-camera me-2"></i>Profile Photo
                                </label>
                                <input type="file" class="form-control" id="profilePhoto"
                                       th:field="*{profilePhoto}" accept="image/*">
                                <small class="text-muted">Optional: Upload a profile picture (JPEG, PNG)</small>
                            </div>

                            <div class="d-grid gap-2">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    <i class="fas fa-user-plus me-2"></i>Register
                                </button>
                            </div>
                        </form>

                        <div class="text-center mt-4">
                            <p class="mb-0">
                                Already have an account?
                                <a th:href="@{/login}" class="text-primary fw-bold">Login here</a>
                            </p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
